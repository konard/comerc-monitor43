include:
  - path: ./backend/docker-compose.yml

services:
  postgres:
    image: postgres:15-alpine
    container_name: monitor-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-monitor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-monitor_p}
      POSTGRES_DB: ${DB_NAME:-monitor}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-monitor}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monitor-network

  redis:
    image: redis:7-alpine
    container_name: monitor-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monitor-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: monitor-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # check_port_connectivity подтверждает, что AMQP listener действительно
      # принимает подключения — `ping` отдаёт OK раньше и приводит к
      # connection refused у dependents.
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity" ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks:
      - monitor-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: monitor-jaeger
    profiles: [ observability ]
    ports:
      - "16686:16686" # UI
      - "14250:14250" # gRPC
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: true
    networks:
      - monitor-network

  prometheus:
    image: prom/prometheus:latest
    container_name: monitor-prometheus
    profiles: [ observability ]
    ports:
      - "9090:9090"
    volumes:
      - ./backend/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - monitor-network

  grafana:
    image: grafana/grafana:latest
    container_name: monitor-grafana
    profiles: [ observability ]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - monitor-network

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:

networks:
  monitor-network:
    name: monitor-network
    driver: bridge
